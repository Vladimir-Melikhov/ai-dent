
{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}
  {% if status_buttons %}
    <div class="ai-dent-order-status-row">
      {% for name, label in status_buttons %}
        <input
          type="submit"
          name="{{ name }}"
          value="{{ label }}"
          class="ai-dent-order-status-button{% if name == '_status_cancelled' %} ai-dent-order-status-danger{% endif %}"
        >
      {% endfor %}
    </div>
  {% endif %}

  {{ block.super }}
{% endblock %}

{% extends "base.html" %}
{% load static %}

{% block title %}Товар — Ай-Дент{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/product.css' %}">
{% endblock %}

{% block content %}

<div class="bg"></div>

<main
  id="product-root"
  class="product-page"
  data-slug="{{ slug }}"
>
  <div class="product-page__tooth">
    <img src="{% static 'img/teeth.webp' %}" alt="">
  </div>

  <div class="product-loading">
    <span></span>
    <span>Загрузка</span>
  </div>
</main>

{% endblock %}

{% block scripts %}
<script type="module" src="{% static 'js/product.js' %}"></script>
{% endblock %}

{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <title>500 — Ошибка сервера — Ai-Dent</title>
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
  <style>
    :root {
      --bg: #f4f3f2;
      --text: #0f1419;
      --muted: #525c6d;
      --accent: #0f1419;
      --accent-hover: #1e252f;
      --border-glass: rgba(255, 255, 255, .85);
      --shadow-glass: 0 16px 40px rgba(15, 20, 28, .07), 0 4px 12px rgba(15, 20, 28, .03);
      --font: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(circle at 50% 35%, rgba(170, 175, 185, .45) 0%, rgba(200, 205, 215, .2) 45%, transparent 70%),
        radial-gradient(circle at 20% 20%, rgba(225, 228, 235, .8) 0%, transparent 50%),
        radial-gradient(circle at 80% 60%, rgba(195, 200, 208, .28) 0%, transparent 55%),
        var(--bg);
      padding: 24px;
    }
    .error-card {
      max-width: 460px;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, .72);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 48px 36px;
      box-shadow: var(--shadow-glass);
    }
    .error-card img { height: 28px; margin-bottom: 28px; }
    .error-card__code {
      font-family: "Instrument Sans", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .error-card__title {
      margin: 0 0 12px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .error-card__text {
      margin: 0 0 28px;
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--muted);
    }
    .error-card a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 13.5px;
      padding: 13px 26px;
      border-radius: 999px;
      transition: transform .2s ease, background .2s ease;
    }
    .error-card a:hover { transform: translateY(-2px); background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="error-card">
    <img src="{% static 'img/logo.png' %}" alt="Ai-Dent">
    <div class="error-card__code">Ошибка 500</div>
    <h1 class="error-card__title">Что-то пошло не так</h1>
    <p class="error-card__text">На сервере произошла ошибка. Мы уже знаем о проблеме и разбираемся. Попробуйте обновить страницу через пару минут.</p>
    <a href="/">На главную</a>
  </div>
</body>
</html>
